<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltMate EV Support</title>
    <style>
        body {
            margin: 0;
            background-color: #121212; /* Dark mode for car dashboard feel */
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .ev-container {
            width: 400px;
            height: 600px;
            background: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 128, 0.1); /* Green glow */
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
            overflow: hidden;
        }

        /* Header - EV Theme */
        .ev-header {
            background: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00ff80;
        }

        .ev-title {
            color: #00ff80; /* Electric Green */
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .ev-status {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* Chat Area */
        .ev-chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .user-msg {
            align-self: flex-end;
            background: #00ff80;
            color: #000;
            font-weight: 600;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            align-self: flex-start;
            background: #2a2a2a;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
            border: 1px solid #444;
        }

        /* Critical Alert Design */
        .alert-msg {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
            align-self: flex-start;
            font-weight: bold;
            border-radius: 8px;
        }

        /* Input Area */
        .ev-input-area {
            padding: 15px;
            background: #000;
            display: flex;
            border-top: 1px solid #333;
        }

        input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 25px;
            color: white;
            outline: none;
        }

        button {
            margin-left: 10px;
            background: #00ff80;
            border: none;
            border-radius: 50%;
            width: 45px;
            color: black;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #00cc6a; }

    </style>
</head>
<body>

    <div class="ev-container">
        <div class="ev-header">
            <div class="ev-title">⚡ VOLTMATE SUPPORT</div>
            <div class="ev-status">AI Charging Assistant</div>
        </div>

        <div class="ev-chat" id="chatBox">
            <div class="msg bot-msg">Hello! I am VoltMate. Are you having trouble charging?</div>
        </div>

        <div class="ev-input-area">
            <input type="text" id="userInput" placeholder="Describe your issue..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            var input = document.getElementById("userInput");
            var text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user-msg');
            input.value = "";

            if (text.toLowerCase() === 'quit') {
                addMessage("Session ended. Drive safe!", 'bot-msg');
                return;
            }

            setTimeout(() => {
                // EV LOGIC
                var crisis = ["broken", "stuck", "stranded", "manager", "fire", "error"];
                var isDanger = crisis.some(word => text.toLowerCase().includes(word));

                if (isDanger) {
                    addMessage("🔴 CRITICAL ALERT", 'alert-msg');
                    addMessage("Engineering team notified. Ticket #EV-2026 created.", 'alert-msg');
                    addMessage("A human specialist is connecting you now...", 'bot-msg');
                } else {
                    var replies = [
                        "Station #44 is online. 3 plugs available.",
                        "Pricing is $0.30/kWh.",
                        "Try replugging the cable firmly.",
                        "Session started. Charging at 150kW."
                    ];
                    addMessage(replies[Math.floor(Math.random() * replies.length)], 'bot-msg');
                }
            }, 600);
        }

        function addMessage(text, cls) {
            var div = document.createElement("div");
            div.className = "msg " + cls;
            div.innerText = text;
            document.getElementById("chatBox").appendChild(div);
            document.getElementById("chatBox").scrollTop = 9999;
        }
    </script>
</body>
</html>
